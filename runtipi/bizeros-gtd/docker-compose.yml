version: "3.9"

services:
  bizeros-gtd-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:latest
    container_name: bizeros-gtd-cloud
    hostname: bizeros-gtd-cloud
    restart: unless-stopped
    networks:
      - tipi_main_network
    environment:
      - MINDWTR_CLOUD_AUTH_TOKENS=${MINDWTR_CLOUD_AUTH_TOKENS}
      - MINDWTR_CLOUD_CORS_ORIGIN=${MINDWTR_CLOUD_CORS_ORIGIN}
    volumes:
      - ${APP_DATA_DIR}/data/cloud:/app/cloud_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/health >/dev/null || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

  bizeros-gtd:
    image: ghcr.io/dongdongbh/mindwtr-app:latest
    container_name: bizeros-gtd
    hostname: bizeros-gtd
    restart: unless-stopped
    depends_on:
      bizeros-gtd-cloud:
        condition: service_healthy
    networks:
      - tipi_main_network
    ports:
      - ${APP_PORT}:5173
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5173/ >/dev/null || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      # Runtipi / Traefik integration
      traefik.enable: true
      traefik.http.middlewares.bizeros-gtd-web-redirect.redirectscheme.scheme: https
      traefik.http.services.bizeros-gtd.loadbalancer.server.port: 5173
      # Local network (HTTP)
      traefik.http.routers.bizeros-gtd-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.bizeros-gtd-insecure.entrypoints: web
      traefik.http.routers.bizeros-gtd-insecure.service: bizeros-gtd
      # Local network (HTTPS)
      traefik.http.routers.bizeros-gtd.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.bizeros-gtd.entrypoints: websecure
      traefik.http.routers.bizeros-gtd.service: bizeros-gtd
      traefik.http.routers.bizeros-gtd.tls.certresolver: myresolver
      # Public domain (HTTPS) — only active if user exposes via Runtipi UI
      traefik.http.routers.bizeros-gtd-public.rule: Host(`${APP_EXPOSED_DOMAIN:-${APP_DOMAIN}}`)
      traefik.http.routers.bizeros-gtd-public.entrypoints: websecure
      traefik.http.routers.bizeros-gtd-public.service: bizeros-gtd
      traefik.http.routers.bizeros-gtd-public.tls.certresolver: myresolver
      # Runtipi metadata
      runtipi.managed: true

networks:
  tipi_main_network:
    name: runtipi_tipi_main_network
    external: true
